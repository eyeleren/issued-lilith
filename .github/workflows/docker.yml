name: CI & Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/arm/v7

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Version from package.json
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "v$version already tagged: no version tags this run"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new"
          fi

  image:
    name: Build & push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      RELEASE: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.is_new == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=${{ needs.check.outputs.major }},enable=${{ env.RELEASE }}

      - name: Build for checks
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          load: true
          tags: lilith:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check ELF alignment for QNAP 32 KB pages
        run: sh .github/scripts/check-elf-alignment.sh lilith:ci

      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Plain single-platform image, friendlier to older Docker engines like Container Station's.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag & GitHub Release
    needs: [check, image]
    if: github.ref == 'refs/heads/main' && needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "Image: \`ghcr.io/${IMAGE_NAME,,}:$VERSION\`"
