# Paste into Container Station » Applications » Create. Expects /share/Container/issued-lilith/lilith.env.
# Container Station rejects resource limits in YAML: set them in its Advanced Settings instead.
services:
  lilith:
    image: ghcr.io/eyeleren/issued-lilith:2
    container_name: issued-lilith
    restart: unless-stopped
    init: true
    env_file: /share/Container/issued-lilith/lilith.env
    environment:
      DATA_DIR: /app/data
    volumes:
      - /share/Container/issued-lilith/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Pulls a newer ghcr.io/eyeleren/issued-lilith:2 daily and recreates only containers labelled above.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: lilith-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Rome
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 30 4 * * *"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
